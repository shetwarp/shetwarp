<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خرید رنک</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v33.003/dist/font-face.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Vazir, sans-serif;
}

body{
    background:url("1 (104).png") center center/cover no-repeat fixed;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
}

.box{
    position:relative;
    z-index:2;
    text-align:center;
    color:#fff;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(8px);
    padding:50px;
    border-radius:20px;
    width:90%;
    max-width:600px;
}

h1{
    font-size:38px;
    margin-bottom:15px;
}

p{
    font-size:20px;
    margin-bottom:35px;
    line-height:1.8;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    color:#fff;
    padding:15px 28px;
    border-radius:12px;
    font-size:20px;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.discord{
    background:#5865F2;
}

.telegram{
    background:#229ED9;
}

.rubika{
    background:#E53935;
}

.btn:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 0 20px rgba(255,255,255,.4);
}
</style>

</head>
<body>

<div class="overlay"></div>

<div class="box">
    <h1> خرید رنک </h1>

    <p>
        برای خرید رنک، در یکی از راه‌های ارتباطی زیر به ما پیام دهید.
    </p>

    <div class="buttons">

        <a class="btn discord" href="https://discord.gg/QYJBPEzb2">
            <i class="fab fa-discord"></i>
            دیسکورد
        </a>

        <a class="btn telegram" href="https://t.me/blockbazar1">
            <i class="fab fa-telegram"></i>
            تلگرام
        </a>

        <a class="btn rubika" href="https://web.rubika.ir/#c=c0DxKQX0527fda3c55cb8e136f62cd97">
            <i class="fas fa-comment-dots"></i>
            روبیکا
        </a>

    </div>

</div>

</body>
</html>
